# fly.toml app configuration file generated for phonebook-pipeline-jaunty-violet-7789 on 2026-09-17T17:42:07+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'phonebook-part11-fso'
primary_region = 'ams'

[build]
  builder = 'paketobuildpacks/builder-jammy-base'

[build.args]
  BP_NODE_RUN_SCRIPTS = 'build'

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
